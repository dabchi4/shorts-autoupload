; Скопируй в channels.ini и заполни. Одна секция = одно «назначение»: YouTube-канал или TikTok-аккаунт.
; Ключи из [DEFAULT] действуют для всех секций, в секции их можно переопределить.
;
; Общие ключи
;   platform   — youtube (по умолчанию) | buffer (TikTok через Buffer) | tiktok (TikTok через браузер)
;   profile    — имя профиля ShardBrowser; для platform = buffer — любое слово, например Buffer
;   source     — папка с роликами: каждый ролик — подпапка «ГГГГ-ММ-ДД Название» с видео и info.txt
;   enabled    — нет: секция пропускается
;   slots      — время публикации для роликов без «Публикация:» в info.txt (местное время компьютера)
;   ai         — да/нет: ответ на вопрос про ИИ/изменённый контент
;   title_suffix         — дописывается к названию на YouTube (в подпись TikTok не идёт)
;   title_in_description — да: первая строка описания = название
;   emoji_first          — да: смайл из конца названия переносится в начало
;   tags, playlist, game, related_video, description_footer — значения по умолчанию для роликов канала
;
; YouTube
;   channel_id — ID канала (UC…), виден в адресе studio.youtube.com/channel/UC…
;   handle     — @имя канала: по нему скрипт переключается между каналами одного Google-аккаунта
;   account    — номер Google-аккаунта в профиле: 0 — первый вошедший, 1 — второй…
;   ad_rating  — «ничего»: в анкете «Требования рекламодателей» (монетизация) отмечать «Ничего из указанного выше»
;
; TikTok
;   tiktok_account — имя аккаунта без @ (как в Buffer)

[DEFAULT]
profile = Main
slots = 12:00, 18:00
ai = нет
ad_rating = ничего
title_in_description = да
emoji_first = да

; --- YouTube-канал (первый Google-аккаунт профиля) ---
[мой-канал]
channel_id = UCxxxxxxxxxxxxxxxxxxxxxx
handle = @my-channel
source = D:\Видео\Мой канал
playlist = Shorts
game = Minecraft
tags = shorts, майнкрафт
description_footer = Подписывайся!\nTelegram: https://t.me/...

; --- YouTube-канал из второго Google-аккаунта в том же профиле ---
[второй-канал]
account = 1
channel_id = UCyyyyyyyyyyyyyyyyyyyyyy
handle = @second-channel
source = D:\Видео\Второй канал
title_suffix = | мой сайт example.com
related_video = https://youtube.com/shorts/xxxxxxxxxxx

; --- те же ролики в TikTok через Buffer + R2 ---
[тт-мой-канал]
platform = buffer
profile = Buffer
tiktok_account = my.tiktok
source = D:\Видео\Мой канал

; --- TikTok через браузер (запасной способ, нужен отдельный профиль ShardBrowser) ---
[тт-через-браузер]
enabled = нет
platform = tiktok
profile = TikTok
tiktok_account = other.tiktok
source = D:\Видео\Второй канал
